<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#020709">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>ACE // Command</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<canvas id="matrix"></canvas>
<div id="overlay"></div>

<!-- Login gate -->
<div id="login" class="hidden">
  <div class="box">
    <div class="title">ACE <span class="v">2.0</span></div>
    <div class="sub">Platinum Fortune Impact</div>
    <input id="login-input" type="password" placeholder="ACCESS CODE" autocomplete="current-password">
    <button id="login-btn">AUTHENTICATE</button>
    <div id="login-err" class="err"></div>
  </div>
</div>

<div id="app" class="hidden">

  <!-- Corner chrome — no bars, no tabs. Up-next lives here now (top, glanceable). -->
  <div id="chrome">
    <div class="wordmark">ACE <span class="dot-sep">◈</span> <span class="dot-sep">PFI</span></div>
    <div id="upnext" class="hidden"></div>
    <div id="chrome-right">
      <div id="mode-toggle" title="Voice mode: mic starts a live call. Chat mode: silent, text-only.">
        <button id="mode-voice" class="mode-seg" aria-pressed="true">VOICE</button>
        <button id="mode-chat" class="mode-seg" aria-pressed="false">CHAT</button>
      </div>
      <div id="clock">--:--</div>
      <button id="chat-toggle" class="icon-btn" title="Conversation" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/>
        </svg>
      </button>
      <div id="link-dot" title="Link"></div>
    </div>
  </div>

  <!-- The stage: the orb is the star. Ace materializes #cards to the side slots. -->
  <div id="stage">
    <div id="orb-wrap">
      <canvas id="orb-canvas" width="640" height="640"></canvas>
      <div id="orb-state">[ IDLE ]</div>
    </div>
    <div id="cards-left" class="card-slot"></div>
    <div id="cards" class="card-slot"></div>
  </div>

  <!-- Conversation lives in a side window you toggle on/off (chat-toggle in chrome). -->
  <aside id="chat-panel">
    <div id="chat-head"><span>CONVERSATION</span><button id="chat-close" title="Close">✕</button></div>
    <div id="messages"></div>
  </aside>

  <!-- The DOCK: one menu housing every surface. Clean stage by default — tap to summon
       a window, tap again to dismiss it. Ace opens the same windows himself when asked. -->
  <!-- CARBON BLACKOUT dock (2026-08-01, Brady's pick: B1+B4) — two banks: ACT (things Ace
       does) / VIEW (things Ace shows). Pure reskin: every button keeps its exact handler. -->
  <div id="quick">
    <div class="qlbl">ACT</div>
    <button class="qa qa-cmd" id="command-btn" title="Your tasks & pipeline — Ace's own board"><span class="qg">◧</span>Command</button>
    <button class="qa" id="pulse-btn" title="How's my business looking? (⌘K works too)"><span class="qg">▦</span>Pulse</button>
    <button class="qa qa-graph" id="graph-btn" title="The knowledge graph — your whole book of business as a live map"><span class="qg">◉</span>Graph</button>
    <button class="qa qa-plan" id="plan-week-btn" title="Ace asks you a few questions, then builds your week"><span class="qg">◈</span>Plan my week</button>
    <button class="qa" data-msg="Give me my morning brief."><span class="qg">☀</span>Brief</button>
    <div class="qlbl">VIEW</div>
    <button class="qa" data-panel="timeline" title="Today's schedule"><span class="qg">▤</span>Schedule</button>
    <button class="qa" data-panel="inbox" title="Priority inbox"><span class="qg">✉</span>Inbox</button>
    <button class="qa" data-panel="weather" title="Weather"><span class="qg">◍</span>Weather</button>
    <button class="qa" data-panel="memory" title="What Ace knows"><span class="qg">◆</span>Memory</button>
  </div>

  <div id="input-bar">
    <button id="mic-btn" class="icon-btn" title="Talk to Ace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>
    <!-- CAPTURE ANYTHING — a plain file input (no `capture` attr) so iOS offers Camera *and*
         Photos *and* Files, and desktop gets a normal picker. Drag-and-drop hits the same path. -->
    <button id="clip-btn" class="icon-btn" title="Capture — photo, PDF, or voice memo">📎</button>
    <input id="capture-file" type="file" accept="image/*,application/pdf,audio/*" multiple hidden>
    <textarea id="chat-input" rows="1" placeholder="Talk to Ace…" autocomplete="off"></textarea>
    <button id="discreet-btn" class="icon-btn" title="Discreet mode — Ace won't say money out loud when you're around people" aria-pressed="false">🔒</button>
    <button id="voice-toggle" class="icon-btn" title="Spoken replies on/off" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      </svg>
    </button>
    <button id="send-btn" class="icon-btn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>

<!-- ElevenLabs Agents SDK for full-duplex live voice (loaded from CDN, off the shell) -->
<script type="module">
  (async function () {
    var cdns = ['https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm', 'https://esm.sh/@elevenlabs/client'];
    for (var i = 0; i < cdns.length; i++) {
      try { var m = await import(cdns[i]); if (m && m.Conversation) { window.__ConvAI = m.Conversation; return; } } catch (e) {}
    }
    window.__ConvAI = null;
  })();
</script>
<script src="/app.js"></script>
</body>
</html>
