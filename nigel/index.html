<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NIGEL — StarCloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="starcloud">
<canvas id="starcloud" aria-hidden="true"></canvas>
<div id="labels" class="labels"></div>

<aside class="sidebar" id="sidebar" aria-label="Primary">
  <div class="brand">
    <div class="wordmark">NIGEL</div>
    <div class="tagline">Intelligence in service<br>of a greater you</div>
  </div>
  <nav class="nav">
    <button class="nav-item is-active" data-nav="/">StarCloud</button>
    <button class="nav-item" data-nav="/today">Today<span class="badge" id="attention-badge">3</span></button>
    <button class="nav-item" data-nav="/office">My Office</button>
    <button class="nav-item" data-nav="/systems/clients">Clients</button>
    <button class="nav-item" data-nav="/systems/pipeline">Pipeline</button>
    <button class="nav-item" data-nav="/systems/investments">Investments</button>
    <button class="nav-item" data-nav="/systems/planning">Planning</button>
    <button class="nav-item" data-nav="/systems/servicing">Servicing</button>
    <button class="nav-item" data-nav="/systems/knowledge">Knowledge</button>
    <button class="nav-item" data-nav="/systems/godpod">GodPod</button>
    <button class="nav-item" data-nav="/settings">Settings</button>
  </nav>
  <div class="sidebar-foot">
    <div class="praxis">PRAXIS<span>Technologies</span></div>
    <div class="foot-note">Prototype · fictional data · simulated AI</div>
  </div>
</aside>
<button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
<div class="scrim" id="scrim"></div>

<div class="corner corner-tr">
  <div class="clock"><div class="date" id="clock-date">THU SEP 12, 2026</div><div class="time" id="clock-time">06:14 AM</div></div>
  <div class="rule"></div>
  <button class="attn" id="topbar-attention"><span class="attn-dot"></span><span id="topbar-attention-text">3 need attention</span></button>
  <div class="quote">“Same faithful God.<br>New opportunities.”</div>
</div>
<div class="corner corner-br">Discipline today<br>A brighter tomorrow</div>

<main id="stage" class="stage" aria-live="polite"></main>

<section class="convo" id="convo" aria-label="Conversation with NIGEL">
  <div class="convo-log" id="convo-log" hidden></div>
  <form class="convo-bar" id="convo-form" autocomplete="off">
    <span class="convo-orb" aria-hidden="true"></span>
    <input id="convo-input" name="q" placeholder="Ask NIGEL..." aria-label="Ask NIGEL">
    <button type="button" class="convo-mic" id="convo-mic" aria-label="Voice input (not in this prototype)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
    </button>
    <button type="submit" class="convo-send" aria-label="Send">↑</button>
  </form>
</section>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="starcloud.js"></script>
<script src="app.js"></script>
</body>
</html>
