<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NIGEL — StarCloud</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="starcloud">
<canvas id="starcloud" aria-hidden="true"></canvas>
<div id="labels" class="labels"></div>

<aside class="sidebar" id="sidebar" aria-label="Primary">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">NIGEL</span>
  </div>
  <nav class="nav">
    <button class="nav-item is-active" data-nav="starcloud"><span class="nav-ico" aria-hidden="true">✦</span><span>StarCloud</span></button>
    <button class="nav-item" data-nav="attention"><span class="nav-ico nav-ico-amber" aria-hidden="true">●</span><span>Attention</span><span class="badge" id="attention-badge">3</span></button>
    <button class="nav-item" data-nav="systems"><span class="nav-ico" aria-hidden="true">◇</span><span>Systems</span></button>
    <button class="nav-item" data-nav="records"><span class="nav-ico" aria-hidden="true">▤</span><span>Records</span></button>
    <button class="nav-item" data-nav="activity"><span class="nav-ico" aria-hidden="true">≡</span><span>Activity</span></button>
  </nav>
  <div class="sidebar-foot">
    <div class="sim-pill"><span class="dot"></span>Simulation</div>
    <div class="foot-note">Fictional data. No live systems.</div>
  </div>
</aside>
<button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
  <span></span><span></span><span></span>
</button>
<div class="scrim" id="scrim"></div>

<header class="topbar">
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="topbar-right">
    <button class="chip chip-amber" id="topbar-attention" title="Open attention">
      <span class="chip-dot"></span><span class="chip-full" id="topbar-attention-text">3 need attention</span><span class="chip-short" id="topbar-attention-n">3</span>
    </button>
  </div>
</header>

<main id="stage" class="stage" aria-live="polite"></main>

<section class="convo" id="convo" aria-label="Conversation with NIGEL">
  <div class="convo-log" id="convo-log" hidden></div>
  <form class="convo-bar" id="convo-form" autocomplete="off">
    <span class="convo-orb" aria-hidden="true"></span>
    <input id="convo-input" name="q" placeholder="Ask NIGEL — try “what needs attention” or “open Paraclete 1”" aria-label="Ask NIGEL">
    <button type="submit" class="convo-send" aria-label="Send">↑</button>
  </form>
  <div class="convo-hint">Simulated responses · no model connected · nothing leaves this page</div>
</section>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="starcloud.js"></script>
<script src="app.js"></script>
</body>
</html>
